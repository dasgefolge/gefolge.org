[package]
name = "gefolge-room-signs"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.23"
futures = "0.3"
gefolge-web-lib = { path = "../lib" }
rocket = { git = "https://github.com/fenhl/Rocket", branch = "forms" }
rocket-util = { git = "https://github.com/fenhl/rocket-util" }
serenity = { version = "0.12", default-features = false }
sqlx = { version = "0.9", features = ["json", "macros", "postgres", "runtime-tokio", "tls-rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
wheel = { git = "https://github.com/fenhl/wheel", features = ["chrono", "rocket", "reqwest", "serde_json"] }
