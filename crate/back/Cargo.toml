[package]
name = "gefolge-web-back"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_plain = "1"
serenity = { version = "0.12", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "macros", "postgres", "runtime-tokio", "tls-rustls"] }
thiserror = "2"
wheel = { git = "https://github.com/fenhl/wheel" }
