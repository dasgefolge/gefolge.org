[package]
name = "gefolge-paypal"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
gefolge-web = { package = "gefolge-web-lib", path = "../lib" }
serenity = { version = "0.12", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["json", "macros", "postgres", "runtime-tokio", "tls-rustls"] }
thiserror = "2"
wheel = { git = "https://github.com/fenhl/wheel" }
